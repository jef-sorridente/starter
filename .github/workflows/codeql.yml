name: CodeQL

# Análise estática de segurança do GitHub (injeção, XSS, segredo
# hardcoded, uso inseguro de crypto...). Roda em PR e toda semana — a
# semanal pega vulnerabilidade nova descoberta em código que não mudou.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

# actions: read é exigido pelo CodeQL pra ler o próprio workflow run —
# sem ele o job falha com "Resource not accessible by integration".
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
