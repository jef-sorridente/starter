name: Título do PR

# Com squash merge, o título do PR vira a mensagem do commit na `main` —
# então ele segue o mesmo padrão (Conventional Commits) dos commits locais.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^.+$
