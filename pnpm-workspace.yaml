packages:
  - "apps/*"
  - "packages/*"

# Script de instalação (postinstall etc.) é bloqueado por padrão no
# pnpm 10 — protege contra dependência comprometida que executa código
# na máquina/CI durante o install. Só o que está `true` aqui roda;
# `false` é recusa deliberada (mensagem de patrocínio ou binário que já
# vem pré-compilado), listada pra silenciar o aviso e documentar.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@swc/core": true
  "@nestjs/core": false
  "@parcel/watcher": false
  unrs-resolver: false

# Versão mínima forçada de dependências transitivas com vulnerabilidade
# conhecida, enquanto o pacote que as puxa não publica versão corrigida.
# Sempre dentro da mesma versão principal (sem quebrar a API). Remova a
# linha quando o `pnpm audit --prod` continuar limpo sem ela.
overrides:
  multer@<2.5.0: ^2.5.0 # via @nestjs/platform-express (GHSA-q7qp-rjg7-q26m e outras)
  body-parser@<1.20.9: ^1.20.9 # via @nestjs/platform-express (GHSA-27r3-jxmh-p828)
  lodash@<4.18.0: ^4.18.0 # via @nestjs/config
  postcss@<8.5.18: ^8.5.18 # via next (GHSA de leitura de arquivo e path traversal)
